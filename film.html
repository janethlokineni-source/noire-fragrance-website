<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />
    <meta name="description" content="The NOIRÉ fragrance film." />
    <title>The Fragrance Film | NOIRÉ</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Inter', sans-serif;
        background: #070707;
        color: #f5f0e8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(ellipse at 50% 45%, rgba(200, 169, 107, 0.09), transparent 58%), #070707;
      }

      .film-page {
        width: min(1440px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(24px, 5vw, 72px);
        display: flex;
        flex-direction: column;
      }

      .film-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        color: #e8d5a5;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 25px;
        letter-spacing: 0.18em;
        text-decoration: none;
      }

      .back-link {
        color: rgba(245, 240, 232, 0.72);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 180ms ease;
      }

      .back-link:hover { color: #e8d5a5; }

      .film-content {
        width: min(1120px, 100%);
        margin: auto;
        padding: 64px 0;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #c8a96b;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-align: center;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 34px;
        color: #f5f0e8;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(36px, 7vw, 72px);
        font-weight: 400;
        line-height: 1;
        text-align: center;
      }

      .film-frame {
        overflow: hidden;
        border: 1px solid rgba(200, 169, 107, 0.28);
        background: #000;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 55px rgba(200, 169, 107, 0.07);
      }

      video {
        display: block;
        width: 100%;
        max-height: 72vh;
        background: #000;
        object-fit: contain;
      }

      @media (max-width: 640px) {
        .film-page { padding: 24px; }
        .film-content { padding: 72px 0; }
        .film-topbar { align-items: flex-start; }
        .back-link { max-width: 130px; text-align: right; line-height: 1.6; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="film-page">
      <header class="film-topbar">
        <a class="brand" href="./" aria-label="NOIRÉ home">NOIRÉ</a>
        <a class="back-link" href="./index.html#collection">Return to the collection</a>
      </header>

      <section class="film-content" aria-labelledby="film-title">
        <p class="eyebrow">The Art of Fragrance</p>
        <h1 id="film-title">The Fragrance Film</h1>
        <div class="film-frame">
          <video id="fragrance-film" controls muted loop playsinline preload="metadata" poster="./bottle-noire-oud.jpg">
            <source src="./perfume-bottle-floating.mp4" type="video/mp4" />
            Your browser does not support HTML video.
          </video>
        </div>
      </section>
    </main>
    <script>
      const film = document.getElementById('fragrance-film');
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        film.autoplay = true;
        film.play().catch(() => {});
      }
    </script>
  </body>
</html>
